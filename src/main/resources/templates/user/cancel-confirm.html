<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/user-layout}">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>レストラン予約システム - キャンセル確認</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <form method="post" th:action="@{/cancel-complete}">
                    <h2 class="mt-3 text-center">キャンセル確認</h2>
                    <table class="table mt-3">
                        <tr>
                            <th>レストラン名</th>
                            <td th:text="${reservation.restaurant.name}"></td>
                        </tr>
                        <tr>
                            <th>予約日時</th>
                            <td th:text="${#temporals.format(reservation.reservedAt, 'yyyy/MM/dd HH:mm')}"></td>
                        </tr>
                        <tr>
                            <th>予約人数</th>
                            <td th:text="${reservation.numberOfGuests} + '人'"></td>
                        </tr>
                        <tr>
                            <th>予約席</th>
                            <td th:text="${reservation.seatDetail.personPerSeat} + '人席'"></td>
                        </tr>
                    </table>
                    <input type="hidden" name="id" th:value="${reservation.id}">
                    <div class="mt-4 mb-0 d-flex justify-content-center gap-2">
                        <input type="submit" class="btn btn-primary btn-fixed" value="予約キャンセル">
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
