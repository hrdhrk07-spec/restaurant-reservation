<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/user-layout}">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>レストラン予約システム - キャンセル確認</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row row-cols-1">
        <div class="col">
            <div>
                <form method="post" th:action="@{/cancel-complete}">
                    <h2 th:text="'レストラン名：' + ${reservation.restaurant.name}"></h2>
                    <p th:text="'予約日時：' + ${#temporals.format(reservation.reservedAt, 'yyyy/MM/dd HH:mm')}"></p>
                    <p th:text="'予約人数：' + ${reservation.numberOfGuests} + '人'"></p>
                    <p th:text="${reservation.seatDetail.personPerSeat} + '人席'"></p>
                    <input type="hidden" name="id" th:value="${reservation.id}">
                    <div class="d-grid gap-2 mt-4 mb-0">
                        <input type="submit" class="btn btn-primary" value="キャンセル">
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
