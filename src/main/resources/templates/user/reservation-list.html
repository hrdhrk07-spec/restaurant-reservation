<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/user-layout}">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>レストラン予約システム - 予約一覧</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container">
        <h2 class="mt-3 mb-3">予約一覧</h2>
        <div th:if="${!#lists.isEmpty(reservationList)}">
            <div class="py-3 border-top" th:each="reservation : ${reservationList}">
                <h5 class="card-title"
                    th:text="'レストラン名：' + ${reservation.restaurant.name}"></h5>
                <p class="mt-3" th:text="'予約日時：' + ${#temporals.format(reservation.reservedAt, 'yyyy/MM/dd HH:mm')}"></p>
                <p th:text="'予約人数：' + ${reservation.numberOfGuests} + '人'"></p>
                <p th:text="'予約ステータス：' + ${reservation.status.label}"></p>
                <div th:if="${reservation.status == T(com.example.restaurantreservation.enums.ReservationStatus).CONFIRMED}">
                    <a class="btn btn-primary btn-fixed" th:href="@{/cancel-confirm/{id}(id=${reservation.id})}">
                        予約キャンセル
                    </a>
                </div>
            </div>
        </div>
        <div class="border-top" th:if="${#lists.isEmpty(reservationList)}">
            <p class="mt-3">現在予約はありません。</p>
        </div>
    </div>
</div>
</body>
</html>
