<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/user-layout}">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>レストラン予約システム - 予約履歴</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row row-cols-1" th:if="${reservationList != null && !#lists.isEmpty(reservationList)}">
        <div class="col" th:each="reservation : ${reservationList}">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title" th:if="${reservation.restaurant.name != null}"
                            th:text="'レストラン名：' + ${reservation.restaurant.name}"></h5>
                        <p class="card-text" th:if="${reservation.reservedAt != null}"
                           th:text="'予約日時：' + ${#temporals.format(reservation.reservedAt, 'yyyy/MM/dd HH:mm')}"></p>
                        <p class="card-text" th:if="${reservation.numberOfGuests != null}"
                           th:text="'予約人数：' + ${reservation.numberOfGuests} + '人'"></p>
                        <div class="d-grid gap-2 mt-4 mb-0">
                            <input type="submit" class="btn btn-primary" value="予約キャンセル">
                        </div>
                    </div>
                </div>
            </a>
        </div>
    </div>
    <div class="row" th:unless="${reservationList != null && !#lists.isEmpty(reservationList)}">
        <p>現在予約はありません。</p>
    </div>
</div>
</body>
</html>
