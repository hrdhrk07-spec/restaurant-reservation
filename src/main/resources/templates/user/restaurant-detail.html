<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/user-layout}">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>レストラン予約システム - レストラン詳細</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row row-cols-1">
        <div class="col">
            <div>
                <form method="get" th:action="@{/reservation-input/{id}(id=${restaurant.id})}">
                    <h2 th:text="${restaurant.name}"></h2>
                    <p th:text="${restaurant.cuisineType}"></p>
                    <img th:if="${restaurant.imagePath != null}"
                         th:src="@{'/images/' + ${restaurant.imagePath}}"
                         class="card-img-top" alt="no image">
                    <p th:text="${restaurant.location}"></p>
                    <p th:if="${#strings.isEmpty(restaurant.holidays)}" th:text="'休業日：無し'"></p>
                    <p th:unless="${#strings.isEmpty(restaurant.holidays)}" th:text="'休業日：' + ${restaurant.holidays}"></p>
                    <div class="d-grid gap-2 mt-4 mb-0">
                        <input type="submit" class="btn btn-primary" value="予約">
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
