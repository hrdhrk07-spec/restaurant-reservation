<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/user-layout}">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>レストラン予約システム - 予約</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row row-cols-1">
        <div class="col"
             th:with="hasSeats=${seatDetailList != null && !#lists.isEmpty(seatDetailList)},
             noSeats=${seatDetailList != null && #lists.isEmpty(seatDetailList)}">
            <div>
                <form th:object="${reservationForm}" method="post"
                      th:action="@{/reservation-input/{id}(id=${restaurant.id})}">
                    <h2 th:text="${restaurant.name}"></h2>
                    <div class="form-floating mb-3">
                        <p th:if="${hasSeats}"
                           th:text="${#temporals.format(reservationForm.reservedAt, 'yyyy/MM/dd HH:mm')}"></p>
                        <input th:unless="${hasSeats}"
                               th:classappend="${#fields.hasErrors('reservedAt')} ? 'is-invalid' : ''"
                               th:field="*{reservedAt}" type="datetime-local" class="form-control" id="reservedAt"
                               name="reservedAt" step="1800">
                    </div>
                    <div class="form-floating mb-3">
                        <p th:if="${hasSeats}"
                           th:text="${reservationForm.numberOfGuests}"></p>
                        <input th:unless="${hasSeats}"
                               th:classappend="${#fields.hasErrors('numberOfGuests')} ? 'is-invalid' : ''"
                               th:field="*{numberOfGuests}" class="form-control" id="numberOfGuests" type="number"
                               min="1" max="100">人
                    </div>
                    <div th:if="${noSeats}">
                        <p>条件に合う空席がありません。</p>
                    </div>
                    <div class="d-grid gap-2 mt-4 mb-0">
                        <input th:unless="${hasSeats}" type="submit"
                               class="btn btn-primary" value="空席確認">
                    </div>
                </form>
            </div>
            <div th:if="${hasSeats}">
                <form method="post" th:action="@{/reservation-confirm}">
                    <div th:each="seatDetail : ${seatDetailList}">
                        <input class="form-check-input" type="radio" th:name="seatDetailId"
                               th:id="'seatDetailId_' + ${seatDetail.id}"
                               th:value="${seatDetail.id}">
                        <label class="form-check-label" th:for="'seatDetailId_' + ${seatDetail.id}">
                            [[${seatDetail.personPerSeat}]]人席
                        </label>
                    </div>
                    <div class="d-grid gap-2 mt-4 mb-0">
                        <input type="submit" class="btn btn-primary" value="予約">
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
