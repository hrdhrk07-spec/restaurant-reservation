<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>サーバーエラー</title>
</head>
<body>
    <p th:text="${error}"></p>
    <!-- ADMIN権限の場合 -->
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/home}">ホームに戻る</a>
    <!-- ADMIN以外の場合 -->
    <a sec:authorize="!hasRole('ADMIN')" th:href="@{/home}">ホームに戻る</a>
</body>
</html>
