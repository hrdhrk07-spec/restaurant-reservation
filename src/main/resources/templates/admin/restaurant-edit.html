<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin-layout}">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>管理者 - レストラン予約システム - レストラン編集</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h3 class="mt-3 mb-3 text-center">レストラン編集</h3>
                <form method="post" th:action="@{/admin/restaurant-delete/{id}(id=${restaurantId})}">
                    <div class="mt-3 mb-3 d-flex justify-content-end">
                        <div class="d-grid"><input type="submit" class="btn btn-danger" value="削除"></div>
                    </div>
                </form>
                <form th:object="${restaurantForm}" method="post"
                      th:action="@{/admin/restaurant-edit/{id}(id=${restaurantId})}">
                    <div class="row mb-3 alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                        <ul class="mb-0">
                            <li th:each="e : ${#fields.globalErrors()}">[[${e}]]</li>
                        </ul>
                    </div>
                    <div class="form-floating mb-3">
                        <input class="form-control" id="name" name="name" type="text"
                               placeholder="" th:field="*{name}"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"/>
                        <label for="name">レストラン名 <span class="text-danger">*</span></label>
                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('name')}"
                             th:errors="*{name}"></div>
                    </div>
                    <div class="form-floating mb-3">
                        <input class="form-control" id="cuisineType" name="cuisineType" type="text"
                               placeholder="和食" th:field="*{cuisineType}"
                               th:classappend="${#fields.hasErrors('cuisineType')} ? 'is-invalid' : ''"/>
                        <label for="cuisineType">ジャンル <span class="text-danger">*</span></label>
                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('cuisineType')}"
                             th:errors="*{cuisineType}"></div>
                    </div>
                    <div class="form-floating mb-3">
                        <input class="form-control" id="location" name="location" type="text"
                               placeholder="大阪府大阪市北区1-1-1" th:field="*{location}"/>
                        <label for="location">所在地 <span class="text-danger">*</span></label>
                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('location')}"
                             th:errors="*{location}"></div>
                    </div>
                    <div class="form-floating mb-3">
                        <input class="form-control" id="imagePath" name="imagePath" type="text"
                               placeholder="sample.jpg" th:field="*{imagePath}"/>
                        <label for="imagePath">画像パス</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input class="form-control" id="holidays" name="holidays" type="text"
                               placeholder="土日" th:field="*{holidays}"/>
                        <label for="holidays">休業日</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input class="form-control" id="receptionStartTime" name="receptionStartTime" type="time"
                               placeholder="17:00" step="1800"
                               th:value="${#temporals.format(restaurantForm.receptionStartTime, 'HH:mm')}"/>
                        <label for="receptionStartTime">受付開始時刻 <span class="text-danger">*</span></label>
                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('receptionStartTime')}"
                             th:errors="*{receptionStartTime}"></div>
                    </div>
                    <div class="form-floating mb-3">
                        <input class="form-control" id="receptionEndTime" name="receptionEndTime" type="time"
                               placeholder="23:00" step="1800"
                               th:value="${#temporals.format(restaurantForm.receptionEndTime, 'HH:mm')}"/>
                        <label for="receptionEndTime">受付終了時刻 <span class="text-danger">*</span></label>
                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('receptionEndTime')}"
                             th:errors="*{receptionEndTime}"></div>
                    </div>
                    <input type="hidden" th:field="*{seatDetail.id}">
                    <div class="form-floating mb-3">
                        <input th:classappend="${#fields.hasErrors('seatDetail.personPerSeat')} ? 'is-invalid' : ''"
                               th:field="*{seatDetail.personPerSeat}" class="form-control" id="personPerSeat"
                               type="number"
                               min="1" max="100">
                        <label for="personPerSeat">一席あたりの人数 <span class="text-danger">*</span></label>
                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('seatDetail.personPerSeat')}"
                             th:errors="*{seatDetail.personPerSeat}"></div>
                    </div>
                    <div class="form-floating mb-3">
                        <input th:classappend="${#fields.hasErrors('seatDetail.numberOfSeats')} ? 'is-invalid' : ''"
                               th:field="*{seatDetail.numberOfSeats}" class="form-control" id="numberOfSeats"
                               type="number"
                               min="1">
                        <label for="numberOfSeats">席セット数 <span class="text-danger">*</span></label>
                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('seatDetail.numberOfSeats')}"
                             th:errors="*{seatDetail.numberOfSeats}"></div>
                    </div>
                    <div class="form-floating mb-3">
                        <input th:classappend="${#fields.hasErrors('seatDetail.duration')} ? 'is-invalid' : ''"
                               th:field="*{seatDetail.duration}" class="form-control" id="duration" type="number"
                               min="1">
                        <label for="duration">所要時間 <span class="text-danger">*</span></label>
                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('seatDetail.duration')}"
                             th:errors="*{seatDetail.duration}"></div>
                    </div>
                    <div class="mt-4 mb-0">
                        <div class="d-grid"><input type="submit" class="btn btn-primary" value="更新"></div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
