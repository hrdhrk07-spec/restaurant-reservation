<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin-layout}">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>管理者 - レストラン予約システム - 予約ステータス変更</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row row-cols-1">
        <div class="col">
            <h3>予約ステータス変更</h3>
            <div>
                <form method="post" th:action="@{/admin/reservation-change/{id}(id=${reservation.id})}">
                    <div>
                        <p th:text="'レストラン名：' + ${reservation.restaurant.name}"></p>
                        <p th:text="'名前：' + ${reservation.user.name}"></p>
                        <p th:text="'電話番号：' + ${reservation.user.phoneNumber}"></p>
                        <p th:text="'メールアドレス：' + ${reservation.user.email}"></p>
                        <p th:text="'予約日時：' + ${#temporals.format(reservation.reservedAt, 'yyyy/MM/dd HH:mm')}"></p>
                        <p th:text="'予約人数：' + ${reservation.numberOfGuests} + '人'"></p>
                        <p th:text="${reservation.seatDetail.personPerSeat} + '人席'"></p>
                    </div>
                    <div th:each="s : ${T(com.example.restaurantreservation.entity.ReservationStatus).values()}">
                        <input type="radio" th:id="${'status_' + s.name()}" name="status" th:value="${s.name()}"
                               th:checked="${s.name() == reservation.status.name()}"/>
                        <label th:for="${'status_' + s.name()}">[[${s.getLabel()}]]</label>
                    </div>
                    <div class="mt-4 mb-0">
                        <div class="d-grid"><input type="submit" class="btn btn-primary" value="更新"></div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
