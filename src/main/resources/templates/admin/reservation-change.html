<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin-layout}">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>管理者 - レストラン予約システム - 予約ステータス変更</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container">
        <div class="row justify-content-center">
            <h3 class="mt-3 text-center">予約ステータス変更</h3>
            <div class="col-md-6">
                <form method="post" th:action="@{/admin/reservation-change/{id}(id=${reservation.id})}">
                    <table class="table mt-3">
                        <tr>
                            <th>レストラン名</th>
                            <td th:text="${reservation.restaurant.name}"></td>
                        </tr>
                        <tr>
                            <th>名前</th>
                            <td th:text="${reservation.user.name}"></td>
                        </tr>
                        <tr>
                            <th>電話番号</th>
                            <td th:text="${reservation.user.phoneNumber}"></td>
                        </tr>
                        <tr>
                            <th>メールアドレス</th>
                            <td th:text="${reservation.user.email}"></td>
                        </tr>
                        <tr>
                            <th>予約日時</th>
                            <td th:text="${#temporals.format(reservation.reservedAt, 'yyyy/MM/dd HH:mm')}"></td>
                        </tr>
                        <tr>
                            <th>予約人数</th>
                            <td th:text="${reservation.numberOfGuests} + '人'"></td>
                        </tr>
                        <tr>
                            <th>予約席</th>
                            <td th:text="${reservation.seatDetail.personPerSeat} + '人席'"></td>
                        </tr>
                    </table>
                    <div th:each="s : ${T(com.example.restaurantreservation.entity.ReservationStatus).values()}">
                        <input type="radio" th:id="${'status_' + s.name()}" name="status" th:value="${s.name()}"
                               th:checked="${s.name() == reservation.status.name()}"/>
                        <label th:for="${'status_' + s.name()}">[[${s.getLabel()}]]</label>
                    </div>
                    <div class="mt-4 mb-0 d-flex justify-content-center">
                        <div class="d-grid"><input type="submit" class="btn btn-primary btn-fixed" value="更新"></div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
