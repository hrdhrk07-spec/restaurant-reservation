<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin-layout}">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>管理者 - レストラン予約システム - レストラン新規登録</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h3 class="mt-3 mb-3 text-center">レストラン新規登録</h3>
                <form th:object="${restaurantForm}" method="post" th:action="@{/admin/restaurant-input}">
                    <div class="row mb-3 alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                        <ul class="mb-0">
                            <li th:each="e : ${#fields.globalErrors()}">[[${e}]]</li>
                        </ul>
                    </div>
                    <div class="form-floating mb-3">
                        <input class="form-control" id="name" name="name" type="text"
                               placeholder="" th:field="*{name}"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"/>
                        <label for="name">レストラン名 <span class="text-danger">*</span></label>
                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('name')}"
                             th:errors="*{name}"></div>
                    </div>
                    <div class="form-floating mb-3">
                        <input class="form-control" id="cuisineType" name="cuisineType" type="text"
                               placeholder="和食" th:field="*{cuisineType}"
                               th:classappend="${#fields.hasErrors('cuisineType')} ? 'is-invalid' : ''"/>
                        <label for="cuisineType">ジャンル <span class="text-danger">*</span></label>
                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('cuisineType')}"
                             th:errors="*{cuisineType}"></div>
                    </div>
                    <div class="form-floating mb-3">
                        <input class="form-control" id="location" name="location" type="text"
                               placeholder="大阪府大阪市北区1-1-1" th:field="*{location}"
                               th:classappend="${#fields.hasErrors('location')} ? 'is-invalid' : ''"/>
                        <label for="location">所在地 <span class="text-danger">*</span></label>
                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('location')}"
                             th:errors="*{location}"></div>
                    </div>
                    <div class="form-floating mb-3">
                        <input class="form-control" id="imagePath" name="imagePath" type="text"
                               placeholder="sample.jpg" th:field="*{imagePath}"/>
                        <label for="imagePath">画像パス</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input class="form-control" id="receptionStartTime" name="receptionStartTime" type="time"
                               placeholder="17:00" th:field="*{receptionStartTime}" step="1800"
                               th:classappend="${#fields.hasErrors('receptionStartTime')} ? 'is-invalid' : ''"/>
                        <label for="receptionStartTime">受付開始時刻 <span class="text-danger">*</span></label>
                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('receptionStartTime')}"
                             th:errors="*{receptionStartTime}"></div>
                    </div>
                    <div class="form-floating mb-3">
                        <input class="form-control" id="receptionEndTime" name="receptionEndTime" type="time"
                               placeholder="23:00" th:field="*{receptionEndTime}" step="1800"
                               th:classappend="${#fields.hasErrors('receptionEndTime')} ? 'is-invalid' : ''"/>
                        <label for="receptionEndTime">受付終了時刻 <span class="text-danger">*</span></label>
                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('receptionEndTime')}"
                             th:errors="*{receptionEndTime}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">定休日</label>
                        <div class="d-flex gap-3">
                            <div th:each="day : ${T(com.example.restaurantreservation.enums.HolidayDayOfWeek).values()}">
                                <input type="checkbox" th:name="holidayDayOfWeeks" th:value="${day}"
                                       th:checked="${restaurantForm.holidayDayOfWeeks != null and #lists.contains(restaurantForm.holidayDayOfWeeks, day)}">
                                <label class="form-check-label" th:text="${day.label}"></label>
                            </div>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <label class="form-label">席詳細</label>
                        <button type="button" class="btn btn-primary btn-sm add-seat-detail">追加</button>
                    </div>
                    <div id="seatDetailContainer">
                        <div class="seat-detail-item"  th:each="seatDetail, iterStat : *{seatDetails}">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <span th:text="'席詳細 ' + (${iterStat.index + 1})"></span>
                                <button type="button" class="btn btn-danger btn-sm remove-seat-detail">削除</button>
                            </div>
                            <div class="form-floating mb-3">
                                <input class="form-control"
                                       th:id="'personPerSeat_' + ${iterStat.index}"
                                       th:name="'seatDetails[' + ${iterStat.index} + '].personPerSeat'"
                                       th:value="${seatDetail.personPerSeat}"
                                       th:classappend="${#fields.hasErrors('seatDetails[' + iterStat.index + '].personPerSeat')} ? 'is-invalid' : ''"
                                       type="number" min="1" max="100">
                                <label th:for="'personPerSeat_' + ${iterStat.index}">一席あたりの人数 <span class="text-danger">*</span></label>
                                <div class="invalid-feedback d-block"
                                     th:if="${#fields.hasErrors('seatDetails[' + iterStat.index + '].personPerSeat')}"
                                     th:errors="*{seatDetails[__${iterStat.index}__].personPerSeat}"></div>
                            </div>
                            <div class="form-floating mb-3">
                                <input class="form-control"
                                       th:id="'numberOfSeats_' + ${iterStat.index}"
                                       th:name="'seatDetails[' + ${iterStat.index} + '].numberOfSeats'"
                                       th:value="${seatDetail.numberOfSeats}"
                                       th:classappend="${#fields.hasErrors('seatDetails[' + iterStat.index + '].numberOfSeats')} ? 'is-invalid' : ''"
                                       type="number" min="1">
                                <label th:for="'numberOfSeats_' + ${iterStat.index}">席セット数 <span class="text-danger">*</span></label>
                                <div class="invalid-feedback d-block"
                                     th:if="${#fields.hasErrors('seatDetails[' + iterStat.index + '].numberOfSeats')}"
                                     th:errors="*{seatDetails[__${iterStat.index}__].numberOfSeats}"></div>
                            </div>
                            <div class="form-floating mb-3">
                                <input class="form-control"
                                       th:id="'duration_' + ${iterStat.index}"
                                       th:name="'seatDetails[' + ${iterStat.index} + '].duration'"
                                       th:value="${seatDetail.duration}"
                                       th:classappend="${#fields.hasErrors('seatDetails[' + iterStat.index + '].duration')} ? 'is-invalid' : ''"
                                       type="number" min="1">
                                <label th:for="'duration_' + ${iterStat.index}">所要時間（分） <span class="text-danger">*</span></label>
                                <div class="invalid-feedback d-block"
                                     th:if="${#fields.hasErrors('seatDetails[' + iterStat.index + '].duration')}"
                                     th:errors="*{seatDetails[__${iterStat.index}__].duration}"></div>
                            </div>
                        </div>
                    </div>
                    <div class="mt-4 mb-4">
                        <div class="d-grid"><input type="submit" class="btn btn-primary" value="新規登録"></div>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script th:src="@{/js/restaurant-form.js}"></script>
</div>
</body>
</html>
