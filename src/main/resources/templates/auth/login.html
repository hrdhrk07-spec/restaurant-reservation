<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/auth-layout}">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>ログイン</title>
</head>
<body>
<div layout:fragment="content">

    <div id="layoutAuthentication">
        <div id="layoutAuthentication_content">
            <main>
                <div class="container">
                    <div class="row justify-content-center">
                        <div class="col-lg-5">
                            <div class="card shadow-lg border-0 rounded-lg mt-5">
                                <div class="card-header"><h3 class="text-center font-weight-light my-4">ログイン</h3>
                                </div>
                                <div class="card-body">
                                    <form method="post" th:action="@{/login}">
                                        <div class="form-floating mb-3">
                                            <input class="form-control" id="email" name="email" type="email"
                                                   placeholder="name@example.com"/>
                                            <label for="email">メールアドレス</label>
                                        </div>
                                        <div class="form-floating mb-3">
                                            <input class="form-control" id="password" name="password" type="password"
                                                   placeholder="Password"/>
                                            <label for="password">パスワード</label>
                                        </div>
                                        <div class="alert alert-danger mb-3" th:if="${param.error}">
                                            ユーザー認証に失敗しました。未登録の方は新規登録をお願いいたします。
                                        </div>
                                        <div class="d-grid gap-2 mt-4 mb-0">
                                            <input type="submit" class="btn btn-primary" value="ログイン">
                                        </div>
                                    </form>
                                </div>
                                <div class="card-footer text-center py-3">
                                    <div class="small"><a th:href="@{/register}">新規登録はこちら</a></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

</div>
</body>
</html>
