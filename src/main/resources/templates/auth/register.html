<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/auth-layout}">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>レストラン予約システム - 新規登録</title>
</head>
<body>
<div layout:fragment="content">
    <div id="layoutAuthentication">
        <div id="layoutAuthentication_content">
            <main>
                <div class="container">
                    <div class="row justify-content-center">
                        <div class="col-lg-7">
                            <div class="card shadow-lg border-0 rounded-lg mt-5">
                                <div class="card-header"><h3 class="text-center font-weight-light my-4">
                                    アカウント作成</h3></div>
                                <div class="card-body">
                                    <form method="post" th:action="@{/register}" th:object="${registerForm}">
                                        <div class="row mb-3 alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                                            <ul class="mb-0">
                                                <li th:each="e : ${#fields.globalErrors()}">[[${e}]]</li>
                                            </ul>
                                        </div>
                                        <div class="form-floating mb-3">
                                            <input class="form-control" id="name" name="name" type="text"
                                                   placeholder="田中　太郎" th:field="*{name}"
                                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"/>
                                            <label for="name">名前 <span class="text-danger">*</span></label>
                                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('name')}"
                                                 th:errors="*{name}"></div>
                                        </div>
                                        <div class="form-floating mb-3">
                                            <input class="form-control" id="phoneNumber" name="phoneNumber" type="tel"
                                                   placeholder="000-000-0000" th:field="*{phoneNumber}"
                                                   th:classappend="${#fields.hasErrors('phoneNumber')} ? 'is-invalid' : ''"/>
                                            <label for="phoneNumber">電話番号 <span class="text-danger">*</span></label>
                                            <div class="invalid-feedback d-block"
                                                 th:if="${#fields.hasErrors('phoneNumber')}"
                                                 th:errors="*{phoneNumber}"></div>
                                        </div>
                                        <div class="form-floating mb-3">
                                            <input class="form-control" id="email" name="email" type="email"
                                                   placeholder="name@example.com" th:field="*{email}"
                                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"/>
                                            <label for="email">メールアドレス <span class="text-danger">*</span></label>
                                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('email')}"
                                                 th:errors="*{email}"></div>
                                        </div>
                                        <div class="row mb-3">
                                            <div class="col-md-6">
                                                <div class="form-floating mb-3 mb-md-0">
                                                    <input class="form-control" id="password" name="password"
                                                           type="password" placeholder="半角15文字以上"
                                                           th:field="*{password}"
                                                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"/>
                                                    <label for="password">パスワード（半角15文字以上） <span class="text-danger">*</span></label>
                                                    <div class="invalid-feedback d-block"
                                                         th:if="${#fields.hasErrors('password')}"
                                                         th:errors="*{password}"></div>
                                                </div>
                                            </div>
                                            <div class="col-md-6">
                                                <div class="form-floating mb-3 mb-md-0">
                                                    <input class="form-control" id="passwordConfirm" name="passwordConfirm"
                                                           type="password" placeholder="Create a password"
                                                           th:field="*{passwordConfirm}"
                                                           th:classappend="${#fields.hasErrors('passwordConfirm')} ? 'is-invalid' : ''"/>
                                                    <label for="passwordConfirm">パスワード確認用 <span class="text-danger">*</span></label>
                                                    <div class="invalid-feedback d-block"
                                                         th:if="${#fields.hasErrors('passwordConfirm')}"
                                                         th:errors="*{passwordConfirm}"></div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="mt-4 mb-0">
                                            <div class="d-grid"><input type="submit" class="btn btn-primary"
                                                                       value="アカウント作成"></div>
                                        </div>
                                    </form>
                                </div>
                                <div class="card-footer text-center py-3">
                                    <div class="small"><a th:href="@{/login}">ログインはこちら</a></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
</div>
</body>
</html>
