<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Restaurant Reservation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>
<div class="d-flex flex-column min-vh-100">
    <!-- ヘッダの読み込み -->
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">レストラン予約</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                        aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/home}">ホーム</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/reservation-list}">予約一覧</a>
                        </li>
                        <li class="nav-item">
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="btn btn-link">ログアウト</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <div class="container-fluid mt-1 p-2" th:if="${showSearch}">
            <form method="GET" th:action="@{/restaurant-list}">
                <div class="row g-1 justify-content-center">
                    <div class="col-auto">
                        <select name="location" id="location" class="form-select">
                            <option value="">--都道府県--</option>
                            <option value="三重県" th:selected="${location == '三重県'}">三重</option>
                            <option value="滋賀県" th:selected="${location == '滋賀県'}">滋賀</option>
                            <option value="京都府" th:selected="${location == '京都府'}">京都</option>
                            <option value="奈良県" th:selected="${location == '奈良県'}">奈良</option>
                            <option value="和歌山県" th:selected="${location == '和歌山県'}">和歌山</option>
                            <option value="大阪府" th:selected="${location == '大阪府'}">大阪</option>
                            <option value="兵庫県" th:selected="${location == '兵庫県'}">兵庫</option>
                        </select>
                    </div>
                    <div class="col-auto">
                        <select name="cuisineType" id="cuisineType" class="form-select">
                            <option value="">--ジャンル--</option>
                            <option value="和食" th:selected="${cuisineType == '和食'}">和食</option>
                            <option value="洋食" th:selected="${cuisineType == '洋食'}">洋食</option>
                            <option value="イタリアン" th:selected="${cuisineType == 'イタリアン'}">イタリアン</option>
                            <option value="フレンチ" th:selected="${cuisineType == 'フレンチ'}">フレンチ</option>
                            <option value="中華" th:selected="${cuisineType == '中華'}">中華</option>
                            <option value="アジア・エスニック" th:selected="${cuisineType == 'アジア・エスニック'}">
                                アジア・エスニック
                            </option>
                        </select>
                    </div>
                    <div class="col-6">
                        <input class="form-control" id="name" name="name" placeholder="レストラン名を入力"
                               th:value="${name}"/>
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-primary">検索</button>
                    </div>
                </div>
            </form>
        </div>
    </header>
    <!-- コンテンツの読み込み -->
    <main class="flex-grow-1" layout:fragment="content"></main>
    <!-- フッターの読み込み -->
    <footer class="py-4 bg-light text-center">
        <div class="text-muted">© Sample, Inc.</div>
    </footer>


</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
